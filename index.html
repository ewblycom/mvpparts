<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MVP Parts — náhradní díly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <header class="app-head">
    <button class="icon-btn" id="menu-btn" type="button" aria-label="Menu">☰</button>
    <a class="logo" href="#/">
      <span class="mvp">MVP</span>
      <span class="parts">PARTS</span>
    </a>
    <a class="icon-btn" href="#/kontakt" aria-label="Mapa">⌖</a>
  </header>
  <form class="search-pill" id="site-search">
    <span>⌕</span>
    <input type="search" data-i18n-placeholder="searchPh" placeholder="Hledat" />
  </form>
  <form class="vin-pill" id="vin-search">
    <input name="vin" maxlength="17" data-i18n-placeholder="vinPh" placeholder="VIN" />
    <button type="submit" data-i18n="vinCta">VIN</button>
  </form>
  <div class="lang-row">
    <button type="button" data-set-lang="cs">CS</button>
    <button type="button" data-set-lang="ru">RU</button>
  </div>
  <div class="garage" id="garage-chip" hidden></div>
  <main id="app"></main>
  <nav class="tabbar">
    <a href="#/" data-tab="home"><i>⌂</i><span data-i18n="tabHome">Domů</span></a>
    <a href="#/katalogy" data-tab="cat"><i>☰</i><span data-i18n="tabCat">Katalogy</span></a>
    <a href="#/ucet" data-tab="acc"><i>→</i><span data-i18n="tabAcc">Přihlásit</span></a>
    <a href="#/objednavky" data-tab="ord"><i>□</i><span data-i18n="tabOrd">Objednávky</span></a>
    <a href="#/kosik" data-tab="cart"><i>&#128722;</i><span data-i18n="tabCart">Košík</span></a>
  </nav>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
