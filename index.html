<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVP Parts — náhradní díly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <div class="topbar">
    <div class="wrap">
      <a href="#/vin" data-i18n="vinTop">Hledat dle VIN</a>
      <a href="#/dodani" data-i18n="when">Kdy dostanu díl?</a>
      <a href="#/dodani" data-i18n="ship">Poštovné</a>
      <a href="#/kontakt" data-i18n="contact">Kontakt</a>
      <span class="spacer"></span>
      <button type="button" data-set-lang="cs">CS</button>
      <button type="button" data-set-lang="ru">RU</button>
    </div>
  </div>
  <header>
    <div class="wrap head">
      <a class="logo" href="#/">
        <span class="mvp">MVP</span>
        <span class="parts">PARTS</span>
      </a>
      <div class="head-meta">
        <a href="tel:+420773079737">+420 773 079 737</a>
      </div>
      <form class="search" id="site-search">
        <input type="search" data-i18n-placeholder="searchPh" placeholder="Hledané číslo dílu, část názvu nebo EAN" />
        <button type="submit" aria-label="Hledat">⌕</button>
      </form>
      <form class="vin-search" id="vin-search">
        <input name="vin" maxlength="17" placeholder="VIN" data-i18n-placeholder="vinPh" autocomplete="off" />
        <button type="submit" data-i18n="vinCta">VIN</button>
      </form>
      <a class="ico-link" href="#/kosik"><small data-i18n="fav">oblíbené</small><b id="fav-count">0</b></a>
      <a class="ico-link cart-link" href="#/kosik"><small data-i18n="cart">můj košík</small><b id="cart-sum">0 Kč</b></a>
    </div>
  </header>
  <div class="garage wrap" id="garage-chip" hidden></div>
  <main id="app"></main>
  <footer>
    <div class="wrap foot">
      <strong>MVP Parts</strong>
      <span>Struktura e-shopu jako Motora. Katalog dílů — API později.</span>
    </div>
  </footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
