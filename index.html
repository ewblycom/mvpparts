<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MVP Parts — náhradní díly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@450;550;650;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <header class="app-head">
    <button class="icon-btn" id="menu-btn" type="button" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="logo" href="#/">
      <span class="mvp">MVP</span>
      <span class="parts">PARTS</span>
    </a>
    <a class="icon-btn" href="#/kontakt" aria-label="Kontakt">
      <svg viewBox="0 0 24 24"><path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
    </a>
  </header>

  <form class="search-pill" id="site-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16.5 16.5L21 21"/></svg>
    <input type="search" data-i18n-placeholder="searchPh" placeholder="Hledat" />
  </form>

  <section class="vin-box">
    <div class="vin-box-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h6M7 13h10"/></svg>
      <span data-i18n="vinTop">Hledat dle VIN</span>
    </div>
    <form class="vin-row" id="vin-search">
      <input name="vin" maxlength="17" autocomplete="off" spellcheck="false" data-i18n-placeholder="vinPh" placeholder="VIN" />
      <button type="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M16.5 16.5L21 21"/></svg>
        <span data-i18n="vinCta">Hledat podle VIN</span>
      </button>
    </form>
    <p class="vin-hint" data-i18n="vinHint">17 znaků kódu VIN vozidla</p>
  </section>

  <div class="lang-row">
    <button type="button" data-set-lang="cs">CS</button>
    <button type="button" data-set-lang="ru">RU</button>
  </div>

  <div class="garage" id="garage-chip" hidden></div>
  <main id="app"></main>

  <nav class="tabbar">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
      <span data-i18n="tabHome">Domů</span>
    </a>
    <a href="#/katalogy" data-tab="cat">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span data-i18n="tabCat">Katalogy</span>
    </a>
    <a href="#/ucet" data-tab="acc">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 19c1.2-3.2 3.5-4.8 6.5-4.8S17.8 15.8 19 19"/></svg>
      <span data-i18n="tabAcc">Přihlásit</span>
    </a>
    <a href="#/objednavky" data-tab="ord">
      <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span data-i18n="tabOrd">Objednávky</span>
    </a>
    <a href="#/kosik" data-tab="cart">
      <svg viewBox="0 0 24 24"><path d="M5 6h1.4l1.3 9.2a1.5 1.5 0 0 0 1.5 1.3h7.6a1.5 1.5 0 0 0 1.5-1.2L20 8H8"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
      <span data-i18n="tabCart">Košík</span>
    </a>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
