<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVP Parts — katalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body data-cat="cars">
  <header>
    <div class="nav">
      <a class="brand-lock" href="index.html">
        <span class="mvp">MVP</span>
        <span class="parts">PARTS</span>
      </a>
      <div class="nav-right">
        <a class="nav-link" href="katalog.html">Katalog</a>
        <a class="nav-link" href="baterie.html">Autobaterie</a>
        <div class="lang" role="group">
          <button type="button" data-set-lang="cs" class="active">CS</button>
          <button type="button" data-set-lang="ru">RU</button>
        </div>
      </div>
    </div>
  </header>

  <section class="catalog" id="katalog">
    <div class="section" style="padding-top:40px">
      <div class="kicker" data-i18n="nav_cat">Katalog</div>
      <h2 data-i18n="cat_title">Katalog vozidel</h2>
      <p class="lead" data-i18n="cat_lead">Značka → model → ceny.</p>
      <div class="cat-tabs" id="cat-tabs" style="display:none"></div>
      <div class="crumbs" id="cat-crumbs"></div>
      <div id="cat-view"></div>
      <div class="form-card" id="objednavka" style="margin-top:28px">
        <h2 data-i18n="form_title">Poptávka</h2>
        <form id="order-form">
          <div><label data-i18n="label_auto">Vozidlo</label><input name="auto" id="auto" required></div>
          <div><label data-i18n="label_vin">VIN</label><input name="vin" id="vin" required maxlength="17"></div>
          <div><label data-i18n="label_name">Jméno</label><input name="jmeno" id="jmeno" required></div>
          <div><label data-i18n="label_phone">Telefon</label><input name="telefon" id="telefon" required></div>
          <div><label data-i18n="label_comment">Díl</label><textarea name="komentar" id="komentar"></textarea></div>
          <button class="btn" type="submit" data-i18n="btn">Odeslat poptávku</button>
          <div id="form-status" class="status"></div>
        </form>
      </div>

      <p class="note-price" data-i18n="cat_note"></p>
    </div>
  </section>

  <footer>
    <div class="foot">
      <div><strong>MVP Parts</strong></div>
      <div>© 2026</div>
    </div>
  </footer>
  <script src="js/site.js"></script>
</body>
</html>
