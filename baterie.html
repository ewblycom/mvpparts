<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVP Parts — autobaterie</title>
  <link rel="stylesheet" href="css/site.css" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body data-cat="bat">
  <header>
    <div class="nav">
      <a class="brand-lock" href="index.html"><span class="mvp">MVP</span><span class="parts">PARTS</span></a>
      <div class="nav-right">
        <a class="nav-link" href="katalog.html">Katalog</a>
        <a class="nav-link is-on" href="baterie.html">Autobaterie</a>
        <div class="lang"><button type="button" data-set-lang="cs" class="active">CS</button><button type="button" data-set-lang="ru">RU</button></div>
        <a class="nav-cta" href="#objednavka">Poptávka</a>
      </div>
    </div>
  </header>
  <section class="catalog" id="katalog">
    <div class="section">
      <h2 data-i18n="tab_bat">Autobaterie</h2>
      <div id="cat-view"></div>
      <div class="form-card" id="objednavka" style="margin-top:28px">
        <form id="order-form">
          <div><label for="auto">Vozidlo</label><input name="auto" id="auto" required></div>
          <div><label for="vin">VIN</label><input name="vin" id="vin" required maxlength="17"></div>
          <div><label for="jmeno">Jméno</label><input name="jmeno" id="jmeno" required></div>
          <div><label for="telefon">Telefon</label><input name="telefon" id="telefon" required></div>
          <div><label for="komentar">Díl</label><textarea name="komentar" id="komentar"></textarea></div>
          <button class="btn" type="submit">Odeslat poptávku</button>
          <div id="form-status" class="status"></div>
        </form>
      </div>
    </div>
  </section>
  <script src="js/site.js"></script>
</body>
</html>
